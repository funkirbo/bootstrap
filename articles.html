<html>

<head>
    <title>articles</title>

    <meta name='description' content="all of my articles.">
    <meta name='date' content = "2026-07-31">

    <meta name='keywords' content='index'>
    
    <meta charset="UTF-8">
    <meta name='subject' content='gaming'>
    <meta name="medium" content="blog">
    <meta name="robots" content="index">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <meta name='rating' content='General'>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href = "style/css/bootstrap.min.css" rel = "stylesheet">
    <script src = "style/js/bootstrap.bundle.min.js"></script>
    <link href = "style/global.css" rel = "stylesheet">

    <script src = "style/js/customelements.js"></script>
    <script src = "style/js/papaparse.min.js"></script>
</head>

<nav id = "navbar"></nav>
<script>
    let element = callNav(false, false, true, false, false);
    document.getElementById("navbar").innerHTML = element;
</script>

<body id = "body" style = "min-height: 100vh;display: grid;grid-template-rows: auto auto auto 1fr;">
    <div class = "mb-1 p-3 text-start text-white">
        <h1 class = "p-1 m-1 pb-2 border-bottom border-2 border-dark-subtle">articles</h1>
    </div>
    <div class = "mb-1 p-3 m-3 mt-0">
        <div class = "row">
            <div class = "col-md-3 mb-2">
                <select class = "form-select" id = "rvsortby" onchange="reloadReviews()">
                    <option value = "A-Z">A-Z</option>
                    <option value = "Z-A">Z-A</option>
                    <option selected value = "N-O">Newest to Oldest</option>
                    <option value = "O-N">Oldest to Newest</option>
                </select>
            </div>
            <div class = "col-md-9">
                    <form class="d-flex" role="search" onsubmit="return false;">
                        <input id = "rvsearch" class="form-control me-2" type="search" placeholder="Search" aria-label="Search" onsearch='reloadReviews()'/>
                    <button class="btn" type="button" id = "rvsearchbtn" onclick='reloadReviews()'>Search</button>
                </form>
            </div>
        </div>
    </div>
    <div class = "mb-1 p-1 text-center">
        <div class = "ft-border p-2 pb-0 ms-5 me-5 mb-3" id = "rvborder">
            <h5 class = "text-white" id = "reviewcount"></h5>
        </div>
        <ul class = "list-group list-group-flush" id = "reviewlist">
        </ul>
        <div id = "loader" class = "visually-hidden">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        function resetReviews()
        {
            document.getElementById("reviewlist").innerHTML = "";
        }

        function articleListElement(title, date, link)
        {
                let bcol = "border-dark-subtle";
            document.getElementById("reviewlist").innerHTML+= (`
            <li class = "list-group-item bg-objects">
                <div class = "row p-1 m-1 ps-3 text-white justify-content-between border-2 border-start ${bcol} align-items-center">
                    <div class = "col-md-10 p-1 text-start">
                        <a href = "${link}" class = "link-underline link-underline-opacity-0 pinktext">
                            <span style = "font-size: 1.25rem;">${title}<br>
                        </a>
                        <span>${date}</span>
                    </div>
                </div>
            </li>
    `);
        }

        async function reloadReviews()
        {
            let rvcount = 0;
            document.getElementById("loader").classList.remove("visually-hidden");
            document.getElementById("rvborder").classList.remove("ft-border");

            searchkey = document.getElementById("rvsearch").value.toUpperCase();
            sortby = document.getElementById("rvsortby").value;
            resetReviews();
            await fetch("data/funkirbo's Spreadsheet - Articles.csv")
            .then(res => res.blob())
            .then(blob => {
                //console.log(blob);
                const csvfile = new File([blob], "text/csv", { type: blob.type });
                //console.log(csvfile);
                Papa.parse(csvfile,
                    {
                        header: true,
                        complete: function(results) {
                            // console.log(results.data);
                            console.log(searchkey);
                            switch(sortby)
                            {
                                case "A-Z":
                                    results.data.sort((a,b) => a.Title.localeCompare(b.Title));
                                    break;
                                case "Z-A":
                                    results.data.sort((a,b) => b.Title.localeCompare(a.Title));
                                    break;
                                case "N-O":
                                    results.data.sort((a,b) => new Date(b.Date) - new Date(a.Date));
                                    break;
                                case "O-N":
                                    results.data.sort((a,b) => new Date(a.Date) - new Date(b.Date));
                                    break;
                                default:
                                    results.data.sort((a,b) => a.Title.localeCompare(b.Title));
                                    break;
                            }
                            results.data.forEach(game => {
                                if (game.Title.toUpperCase().includes(searchkey))
                                {
                                    articleListElement(game.Title, game.Date, game.Link);
                                    rvcount += 1;
                                    // console.log(rvcount);
                                }
                                document.getElementById("reviewcount").textContent = "Articles: " + rvcount;
                            });
                        },
                        error: function(error) {
                            console.error(error.message);
                        }
                    }
                );
            })
            document.getElementById("loader").classList.add("visually-hidden");
            document.getElementById("rvborder").classList.add("ft-border");
        }

        reloadReviews();

        window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            // Reloads the entire window from scratch
            window.location.reload(); 
        }
        });
    </script>
    </script>
</body>

    callBody();
</script>

    document.getElementById("footer").innerHTML = callFooter();
