                <p>that&#39;s really it, and all of those (outside behemoth, fuck that boss) are easily fixable in a game moving forward. despite it&#39;s corniness, the story was really nice and hit pretty hard when it needed to. i like the light vs. darkness theming, and while it sometimes felt like 8 year olds larping, the campiness helped it feel more fun than annoying.</p>
