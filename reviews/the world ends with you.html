                <p>there are some games that are just meant to be played on original hardware. whether it be a strange control scheme or a console-exclusive gimmick, certain experiences are just better as originally intended. going into <em>the world ends with you</em>, this was something i was well aware of, so i shelled out the extra dough to pick up a complete copy of the game on DS. as i don&#39;t own any model of the original DS, i instead played the game on my new 2DS XL, which, in my eyes, would just improve the experience.</p>
                <p>it did not. <em>the world ends with you</em>, to me, often felt extremely overwhelming, as the top and bottom screens both use largely separate combat systems, and looking between the two was just too much on the brain. i talked about this disconnection in a discord server i&#39;m in, and <a class = "pinktext link-underline link-underline-opacity-0" href="https://backloggd.com/u/PhantasM/">PhantasM</a>, another person who played the game on a larger handheld, shared largely the same sentiment.</p>
                <p><em>the world ends with you</em> is the only game i can think of where playing on the original DS instead of a larger 3DS model is legitimately necessary for most people. because the game&#39;s combat is... let&#39;s just say, a little chaotic at times, having less screen and a smaller gap in between the two screens is legitimately game-changing. that&#39;s not to say the combat in <em>twewy</em> is awful even on a larger handheld, but i found myself consistently missing combos on both the top and bottom screens more than i would&#39;ve had i played on a more compact system.</p>
                <p>the combat system itself is genuinely excellent, and rather innovative for an earlier DS release. both screens have simple controls, the bottom &quot;main&quot; screen being a beat-em-up controlled by the stylus, and the top &quot;partner&quot; screen being some sort of puzzler-arcade-y combo taking inputs from the d-pad (or ABXY, if you&#39;re a lefty). as the story evolves, your partner will change, and with a new partner comes a new combo system. while each character is controlled separately, you can&#39;t really ignore either if you&#39;d like to maximize your damage output, as continuing combos on the top screen fuels fusion attacks that damage everything in sight.</p>
                <p>and that&#39;s sort of the crux of it all, right? you can&#39;t ignore either screen, but on a larger device, it&#39;s hard to focus on both at once, especially with how fast-paced some of the battles get. it&#39;s a tough balance to manage when both screens are visible in your regular view; juggling both combos when you can&#39;t was, at least to me, nigh impossible.</p>
                <p>and maybe that&#39;s all on me, for playing on a bigger set of screens than what was designed. what&#39;s decidedly not my fault, though, is how repetitive this game gets in every aspect, not just in its gameplay.</p>
                <p>it&#39;s easiest to start with the battles, while we&#39;re still on the topic. each battle pits you up against a set of a couple different enemies called noise. there are a ton of different enemies that you encounter throughout the game, and each area has a distinct set of possible encounters which change as you progress. the problems arise when you&#39;re forced to fight 3-4 of these battles in a row, meaning you&#39;re often battling against the same set of noise over, and over, and over. not to mention segments, especially near the end of the game, where missions consist of fighting multiple of the exact same type of enemy to progress anywhere on the map. their patterns don&#39;t change, so it feels less like a challenge and more like a waste of time.</p>
                <p>even moving around shibuya gets a little tedious at times. while the city is beautifully portrayed in <em>twewy</em>&#39;s distinct art style, you eventually get bored of walking the same routes to the same locations over, and over, and over. it&#39;s made worse by the game&#39;s structure, which often places you right back in the scramble after a chapter is finished, meaning you&#39;re walking to the other side of the map over again. it&#39;s not the worst by any means, but it is noticeable, and that tedium adds up throughout the course of the game.</p>
                <p>the story falls victim to this, though to a far lesser extent. i like most of the characters: neku&#39;s development from coldhearted, isolated asshole to a still-blunt yet caring teen is great, shiki is a wonderful take on jealousy and the benefits of being yourself, rhyme and beat make a great duo that bounce off each other wonderfully, and... we don&#39;t have to talk about joshua. the whole &quot;expand your world, open your horizons, be yourself&quot; theming is really well-done, and the crowded, trendy setting of shibuya works perfectly to complement the overarching narrative. some villains are reasonable and fun, others are a little over-the-top, but all of them have interesting and fleshed out motivations that i genuinely enjoyed learning about. i have very few problems with the actual narrative itself, and the vast majority of those problems come down to me just not liking joshua as a character.</p>
                <p>the issues arise in how this story is told; the game LOVES extremely obvious foreshadowing, often to its detriment. a good chunk of the story beats, including major twists, will often be introduced through little chunks of dialogue between side characters well before they&#39;re introduced. it&#39;s extremely apparent when you&#39;re being fed information that you need to remember, and when the twists actually come up, sometimes they just don&#39;t hit as hard as they should, because you&#39;re given a lot of the details far ahead of time.</p>
                <p><em>the world ends with you</em> frustrates me in a lot of ways, because i see how this game could be really cool, while also understanding that my time with it was likely hampered by a less-than-optimal choice of handheld. had i played this on the right console, i could easily see this being a better experience, but there are still flaws baked into the core of this game that would pop up regardless of how i played it. i didn&#39;t even mention how the game bombards you with way too many text-based tutorials, or the amazing music being used over, and over, and over again.</p>
                <p>i don&#39;t want to discount how good this game is, because each element of it is really, REALLY interesting. the combat, on its own, is an amazing concept with solid execution. it&#39;s aesthetically distinct in both its art and music. the narrative has excellent theming with a cast of likable, fun characters who genuinely evolve throughout the course of the game, and the ending ties everything up rather nicely.</p>
                <p>the best analogy i can use for <em>the world ends with you</em> is a puzzle where every little divot that connects the pieces together was cut off. you can still put the puzzle together, but it&#39;s not stable, and there are little holes missing everywhere. <em>twewy</em> has all the right pieces, but it fails to connect them in meaningful ways, leading to a fun, yet slightly underwhelming experience.</p>
