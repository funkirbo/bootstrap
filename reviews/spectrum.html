                <p>spectrum is weird to me.</p>
                <p>the premise isn&#39;t crazy. you gain colors, and when you activate those colors, platforms and other obstacles pop up. it&#39;s not complicated, and as a core concept for a puzzle platformer, it does a great job.</p>
                <p>...well, at least in theory. because - get this - spectrum isn&#39;t a puzzle platformer. its levels are designed around being played at a faster pace, there&#39;s a timer for each individual level, and the obstacles at play are extremely quick. the game wants to play like a traditional platformer, with the mechanics of a puzzle platformer, and that ideology is why the game falters.</p>
                <p>i think the controls are the easiest example of how the genre mixing fails. each individual color is its own button on the keyboard, meaning you&#39;re handling 5 extra buttons on top of your general movement. there&#39;s also crystals you can dash with, which involve a sixth button. you see the problem, right? you&#39;re balancing 6 extra buttons, all of which need to be hit with relatively precise timing, at all points throughout the game. it&#39;s not as if you&#39;re intended to pause and think about each individual action, like in a puzzle platformer; you&#39;re intended to fully manage all 5 colors at all times. by 3 colors, it&#39;s a mess. by 4, it&#39;s damn annoying to manage. by 5, it&#39;s a nightmare.</p>
                <p>if spectrum was intended to be a puzzle platformer, this control scheme would work wonders! you wouldn&#39;t spend time switching through each color every time you wanted to make a new decision, and you could focus on using one or two colors at a time. it just doesn&#39;t make sense when the game&#39;s intended to run at a fast pace.</p>
                <p>the level design also runs assuming that balancing all the colors at your disposal is as easy as pie, when because of the control scheme, it never really will be. there&#39;s moments when you&#39;re consistently switching through 4 different colors while managing movement and dashing and avoiding the heat-seeking missiles chasing your trail; it&#39;s just overwhelming.</p>
                <p>it feels like the game started as a puzzle platformer, and at some point shifted into a traditional one, and at no point in between were the controls or mechanics rethought to fit to work in the new format. i see the vision, but the result just isn&#39;t fun.</p>

            `;
