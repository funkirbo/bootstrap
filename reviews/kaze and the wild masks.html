                <p>the level design is quite good throughout the game, the bosses feel climactic, there&#39;s plenty of stuff to collect, and the game feels pretty polished. plenty of bonus content and hidden collectibles make each level fun to explore again, and the different forms (essentially this game&#39;s version of the animal companions) add great flexibility in how levels can be designed. also, weird compliment - the UI is like... really good. like surprisingly REALLY good.</p>
