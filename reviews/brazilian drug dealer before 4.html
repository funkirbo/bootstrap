                <p>the moment i remembered this game released today was a magical one. a mere 3 hours ago, i was sitting in a lecture, when i (in my boredom), scrolled on my steam wishlist. lo and behold, the most anticipated game of all time was out, ready for me to sink my teeth into the moment i had the change. my day immediately flipped from a &quot;honk-mi-mi-mi&quot; to a &quot;yippee!!!&quot; in mere moments. thank goodness steam only shows the last 4 digits of your saved card, because i bought it there and then. i had (HAVE) homework due, but i couldn&#39;t wait another nanosecond. not even a picosecond. i don&#39;t know any measurements smaller than that, BUT I COULDN&#39;T WAIT.</p>
                <p>and my goodness, did this game live up to my expectations. it&#39;s just... more, of everything. more music, more enemies, more bosses, more level designs that feel like they really, really shouldn&#39;t work until you realize you&#39;ve finished the level and nothing felt out of place. the sensory overload that <em>brazilian drug dealer 3</em> brought to the table is back, this time with a side of pure cocaine.</p>
                <p>the combat is now even more ridiculous, with the dash plus double jump combo meaning you can just thrust yourself directly into and out of hordes of enemies with ease. you feel so good at video games flying the fuck around these open battlefields with 7 trillion enemies right at your feet. plus, now that the movement is more than just base <em>quake</em>, there are platforming segments! neat! everything is just as clunky as the last game, but like... i don&#39;t care. i think it adds to the absurdity of it all to have a dash that just barely works, and a double jump that sends you flying god knows where whenever you pop it. is it a little annoying during the platforming sections? yeah, sure. but there&#39;s almost never any actual punishment other than wasting 15 seconds of my time, so it&#39;s not a big deal or anything.</p>
                <p>there&#39;s also a random racing level in the middle of it all, by the way. it shows up once for exactly one level and is never mentioned again. there is no reason for it. it is also one of my favorite levels in the game. shoutout.</p>
                <p>there&#39;s more of an emphasis on plot now, too, though &quot;more of an emphasis&quot; compared to its predecessor means an actual plot exists. NPCs show up with little dialogue boxes throughout each level, explaining whatever&#39;s happening despite it all going in and out my brain the moment i get into a single gun fight. it&#39;s fun to see whatever insane shit each person says, and i think i almost understand the larger plot at play, which is enough.</p>
                <p>it feels like art. the overwhelming music, the goofy plot, the eye-searingly saturated color palette and inconsistently modeled textures, and the level design that&#39;s the right mix of terrible and intentional. there&#39;s obviously a purpose with most of the stuff here, but sometimes the game tows the line between &quot;this is shit design on purpose&quot; and &quot;this is shit game on accident&quot;, and honestly, that adds to the experience. not knowing whether something was meant to be the way it is or not is 1000x better than assuming it&#39;s bad or good on purpose. it&#39;s magical. </p>
                <p>i could make some meaningful statement about how indies are willing to take more risks with their game design that triple-A studios just can&#39;t do, but honestly i don&#39;t care. who cares. play what makes you happy. i like smooth-to-the-touch, uber-polished triple-A games that feel smooth as butter, but i also like dumb ass shit like <em>brazilian drug dealer</em> that is the polar opposite. enjoy life, smell the roses, support cool things and don&#39;t support uncool things.</p>
