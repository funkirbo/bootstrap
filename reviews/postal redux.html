                <p>i don&#39;t dislike what it&#39;s trying to go for, not at all. i think a fully insane person shooting their way through a complete mental breakdown is a really interesting concept, and postal executes it pretty decently. it&#39;s less that it&#39;s chastising you for shooting civilians, a la hotline miami, but you only benefit from killing those who oppose you. postal guy understands the difference between his obstacles and those simply in his way, and it&#39;s up to you to choose whether killing them is worth it.</p>
                <p>my problem is that each of these levels often turn into mindless killings, which i guess is the point, right? it wants you to become completely desensitized to mowing down these people, spewing goofy one liners while ending the lives of hundreds. that mindlessness, though, often makes... y&#39;know, <em>playing the game</em> pretty boring.</p>
