                <p>there are some people out there who will immediately disregard <em>brazilian drug dealer 3</em> for... well, for being what it is. because, honestly, what you see is kind of what you get: the game looks like a complete fever dream, and it plays like a complete fever dream. there&#39;s nothing hiding behind the curtains, no secret message here. it&#39;s <em>quake</em>, with weirder level design and a far less coherent theme. cool. that&#39;s obviously underselling it a little bit, but at its core, <em>bdd3</em> is a very straightforward game. you run through levels collecting keys and whatnot, beating waves of enemies, and finding the end of each level. it&#39;s a quick one, too; my playthrough only took 3 hours.</p>
                <p>but games like this work because of how singular the experience is outside of the gameplay. the blasting music, the waves of texture-swapped enemies, the jagged walls and doors with stock microsoft fonts, they all made me laugh in various stupid ways. despite the (surprisingly good) level design not exactly requiring the most brainpower, i was still having fun just seeing what stupid visual gag or silly enemy would pop up next. plus, because it&#39;s so short, it&#39;s easy to pick up and play for an afternoon without getting tired of the game&#39;s whole shtick.</p>
                <p>it&#39;s dumb fun, tuned surprisingly well to be as dumb as possible. there&#39;s intent with every level design choice; things make sense, despite how much the game wants to convince you that they don&#39;t. i was rarely truly frustrated with a level, and that helps, because even the slightest bit of friction in this type of game can totally ruin the atmosphere that it&#39;s going for. not to say that it&#39;s a carefree romp by any means, there is still difficulty here, but it all feels remarkably fair. it helps that everything runs on the <em>quake</em> engine, which means that the actual shooting and physics feel great as well.</p>
                <p>there&#39;s barely a story, zero consistent atmosphere outside of being <strong>Overwhelmingly Loud</strong>, and the gunplay is extremely basic. all of those critiques towards <em>brazilian drug dealer 3</em> are extremely fair and warranted, and i will not argue against them. yet, playing this game in a voice call with some of my friends is an experience i will relish for as long as i play video games. moments where you can bond with your peers over something so ridiculously stupid are few and far between, and it&#39;s rarer to find them in games you can even consider okay, LET ALONE good.</p>
                <p>this is NOT &quot;so bad it&#39;s good&quot;. it&#39;s &quot;so stupid you can&#39;t help but laugh&quot;, which, if possible, i prefer. run through it in a few hours with some of your best buddies, and i guarantee you&#39;ll have some fun.</p>
