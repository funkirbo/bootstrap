                <p><em>420blaze it 2</em> has exactly one joke.</p>
                <p>and like, yeah, that joke is kind of funny for the first... half hour? during the first two or three stages, you&#39;re in this honeymoon phase with the game&#39;s humor. 2014 humor is extremely easy to make fun of, and there&#39;s enough content frontloaded into the game where you can always find something new to laugh at.</p>
                <p>by the fifth or sixth level, this game is a BORE. it&#39;s a fine, rather uninteresting FPS game mechanically, just with a purposely-outdated coat of paint over it. the MLG montage effects that flash after you get a headshot (yes, EVERY TIME you kill with a headshot) get grating quickly, the very small enemy variety limits the game&#39;s level design pretty drastically, and each level is far too long for how little you&#39;re actually doing. there are fun little power-ups and plenty of gun variety, yet only a couple of levels actually use said power-ups to fundamentally change how you attack the enemies. there&#39;s maybe one interesting set piece in the entire game. if you completely ignore all of the visuals, there&#39;s almost nothing meaningfully different here.</p>
                <p>the game&#39;s humor is its draw, but even that doesn&#39;t hit as hard as it probably should. a game like <em>420blaze it</em> should poke fun at itself a little more, but this one treats what you&#39;re doing a little too seriously. I can&#39;t tell whether the developers of this game (led by the same guy that made fucking CROSSY ROAD) genuinely find this style of humor funny, because the joke is played almost fully straight. it doesn&#39;t poke fun at MLG humor, it just... is MLG humor. which, even in the sea of AI slop humor, tung tung tung sahur bullshit, and six seven hand waves, is still notably annoying and unbearable after a certain point.</p>
                <p>it feels like a kid that never grew up, someone stuck in an age long past. you don&#39;t want to interact with someone still making attack helicopter jokes in the modern day, because i guarantee that guy is super fucking annoying. <em>420blaze it 2</em> is that kid, personified into a game, complete with the substance underneath the surface being rather standard and pretty boring.</p>
                <p>and like, yeah, it&#39;s a competent shooter at the end of the day. it&#39;s not horrifyingly bad, and before the charm wears off, the game is kind of fun. your mileage may vary, depending on how nostalgic you are for this era of the internet. eventually, though, you will probably run out of gas.</p>
            `
