                <p>i appreciate how little the game cares, if you get what i mean. it’s not complicated, it’s a simple story that both kids and adults can enjoy. the humor may be dry, but kids don’t really care. and the style may be very childish, but the game never talks down to the player in any way. it’s perfect for everyone. if you can’t get behind that, i think you’re just kind of a stick in the mud.</p>
